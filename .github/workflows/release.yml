name: Version Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  versioning:
    name: Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-deps

      - uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
